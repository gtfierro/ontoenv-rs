[package]
name = "ontoenv"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Rust library for managing ontologies and their imports in a local environment."
repository.workspace = true
homepage.workspace = true

[dependencies]
anyhow.workspace = true
regex.workspace = true
walkdir.workspace = true
reqwest.workspace = true
json-ld.workspace = true
serde_json.workspace = true
env_logger.workspace = true
log.workspace = true
serde_regex.workspace = true
globset.workspace = true
chrono.workspace = true
petgraph.workspace = true
clap.workspace = true
dunce = "1"
derive_builder.workspace = true
serde.workspace = true
oxigraph.workspace = true
rdf5d.workspace = true
lazy_static = "1.4.0"
serde_with = "3.7.0"
tempfile = "3.10.1"
fs2 = "0.4"
url = "2.5"
blake3.workspace = true
redb = { version = "=4.3.0", optional = true, features = ["experimental-multiprocess"] }
rand = { workspace = true, optional = true }

[features]
rocksdb = ["oxigraph/rocksdb"]
# Experimental snapshot storage requires Rust 1.90 (redb's minimum version).
transactional-snapshots = ["dep:redb", "dep:rand"]

[[example]]
name = "transactional_snapshots"
required-features = ["transactional-snapshots"]

[[example]]
name = "snapshot_profile"
required-features = ["transactional-snapshots"]

[package.metadata.docs.rs]
rustdoc-args = ["--html-in-header", "arborium-header.html"]
