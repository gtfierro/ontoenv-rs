[package]
name = "ontoenv-python"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Command line tool to manage ontologies and their imports in a local environment"
repository.workspace = true
homepage.workspace = true
build = "build.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "ontoenv_python"
crate-type = ["cdylib"]
doc = false

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
ontoenv.workspace = true
ontoenv-cli = { workspace = true, optional = true }
anyhow.workspace = true
oxigraph.workspace = true
env_logger.workspace = true
log.workspace = true
rand.workspace = true
blake3.workspace = true
chrono.workspace = true
oxrdf.workspace = true
spargebra.workspace = true
spareval.workspace = true
rdf5d = { workspace = true, features = ["mmap", "sparql", "idx"] }

[build-dependencies]
pyo3-build-config = "0.29"

[features]
default = ["abi3"]
abi3 = ["pyo3/abi3-py311"]
cli = ["ontoenv-cli"]
rocksdb = ["oxigraph/rocksdb", "ontoenv/rocksdb"]

[package.metadata.docs.rs]
rustdoc-args = ["--html-in-header", "arborium-header.html"]
