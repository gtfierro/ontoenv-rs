# Deploy Sphinx docs to GitHub Pages using the builddocs helper.
name: Deploy docs to Pages

on:
  push:
    branches: ["main"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Release tag to build and archive (empty builds development docs)"
        type: string
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.docs-url.outputs.url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Checkout documentation source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.version_tag || github.ref }}
          path: _docs_source

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install system dependencies
        # See ci.yml: drop the runner image's third-party apt sources first.
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Sync docs environment
        working-directory: _docs_source/docs
        env:
          UV_SYSTEM_RESOLVE: "0"
        run: uv sync --project .

      - name: Install ontoenv into docs venv
        working-directory: _docs_source/docs
        env:
          UV_SYSTEM_RESOLVE: "0"
        run: uv pip install --project . -e ../python

      - name: Build Sphinx HTML
        working-directory: _docs_source/docs
        env:
          UV_SYSTEM_RESOLVE: "0"
        run: uv run --project . sphinx-build -M html . _build

      - name: Build llms.txt
        working-directory: _docs_source/docs
        env:
          UV_SYSTEM_RESOLVE: "0"
        run: |
          uv run --project . sphinx-build -M text . _build
          find _build/text -name '*.txt' ! -name 'changelog.txt' -print | sort | xargs -r cat > _build/llms.txt
          cp _build/llms.txt _build/html/llms.txt

      - name: Stage Pages site
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.version_tag }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          history_dir="$RUNNER_TEMP/pages-history"
          repo_host="${GITHUB_SERVER_URL#https://}"
          repo_url="https://x-access-token:${GITHUB_TOKEN}@${repo_host}/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$repo_url" gh-pages >/dev/null 2>&1; then
            git clone --depth 1 --branch gh-pages "$repo_url" "$history_dir"
          fi
          python .github/scripts/stage_pages.py \
            --html _docs_source/docs/_build/html \
            --history "$history_dir" \
            --output docs/_build/pages \
            --tag "$RELEASE_TAG"

      - name: Persist Pages history
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          repo_host="${GITHUB_SERVER_URL#https://}"
          repo_url="https://x-access-token:${GITHUB_TOKEN}@${repo_host}/${GITHUB_REPOSITORY}.git"

          cd docs/_build/pages
          git init
          git checkout -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git commit -m "Update docs site for ${GITHUB_REF_NAME}"; then
            git push --force "$repo_url" gh-pages
          fi
          rm -rf .git

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Report docs URL
        id: docs-url
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.version_tag }}
        run: |
          page_url="${{ steps.deployment.outputs.page_url }}"
          if [[ -n "$RELEASE_TAG" ]]; then
            docs_url="${page_url%/}/versions/$RELEASE_TAG/"
          else
            docs_url="${page_url%/}/dev/"
          fi
          echo "url=$docs_url" >> "$GITHUB_OUTPUT"
          echo "::notice title=Docs URL::$docs_url"
